{% extends 'portal_base.html' %}
{% load static %}

{% block title %}
    <h3 class="text-center mb-0 text-white">{{ cruise.departure_station }} - {{ cruise.arrival_station }}
        - {{ cruise.train_number }}</h3>
{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">
                {% csrf_token %}
                <!-- Видеопоток с камеры -->
                <div class="mb-3" id="video-container">
                    <div class="video-container text-center mb-3">
                        <canvas id="video-canvas" class="border rounded"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'assets/vendor/libs/animate-css/animate.css' %}"/>
    <link rel="stylesheet" href="{% static 'assets/vendor/libs/sweetalert2/sweetalert2.css' %}"/>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
        }

        #video-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
{% endblock %}

{% block js %}
    <script>
        // Начинаем прослушивание после первого нажатия
        document.body.addEventListener('click', () => {

            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Ошибка включения полноэкранного режима: ${err.message}`);
            });
        }, {once: true});

        document.addEventListener("DOMContentLoaded", function () {
            const videoCanvas = document.getElementById('video-canvas');
            let stream;
            let recognitionInProgress = false;
            let noFaceCounter = 0;
            let lastAnnouncementTime = 0;

            navigator.mediaDevices.getUserMedia({video: true})
                .then(cameraStream => {
                    stream = cameraStream;
                    const context = videoCanvas.getContext('2d');
                    videoCanvas.width = 640;
                    videoCanvas.height = 480;
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();

                    function drawFrame() {
                        context.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);
                        requestAnimationFrame(drawFrame);
                    }

                    drawFrame();

                    // Начать распознавание с интервалом 0.1 секунда
                    setInterval(takeAndSendPhoto, 100);
                })
                .catch(error => {
                    console.error("Ошибка при доступе к камере:", error);
                });

            function announceInvitation() {
                const currentTime = Date.now();
                if (currentTime - lastAnnouncementTime > 10000) { // Проверяем, прошло ли 10 секунд с последнего объявления
                    const message = "Уважаемые пассажиры! Подойдите, пожалуйста, к терминалу для регистрации!";
                    const utterance = new SpeechSynthesisUtterance(message);
                    utterance.lang = 'ru-RU';
                    window.speechSynthesis.speak(utterance);
                    lastAnnouncementTime = currentTime;
                }
            }

            function takeAndSendPhoto() {
                if (recognitionInProgress) return;

                recognitionInProgress = true;

                const context = videoCanvas.getContext('2d');
                context.save();
                context.translate(videoCanvas.width, videoCanvas.height);
                context.rotate(Math.PI);
                context.drawImage(videoCanvas, 0, 0, videoCanvas.width, videoCanvas.height);
                context.restore();
                const imageDataURL = videoCanvas.toDataURL('image/png');

                fetch('{% url 'recognize_face_ajax' %}', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `photo_data=${encodeURIComponent(imageDataURL)}&cruise_id={{ cruise.id }}`,
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            noFaceCounter = 0;
                            const message = `Здравствуйте, ${data.data.user_name}! Ваше место ${data.data.seat_number}, хорошей поездки!`;
                            const utterance = new SpeechSynthesisUtterance(message);
                            utterance.lang = 'ru-RU';
                            window.speechSynthesis.speak(utterance);
                            return showSweetAlert('success', 'Авторизация прошла успешно', message, 8000);
                        } else if (data.status === 'not_registered') {
                            noFaceCounter = 0;
                            const message = 'Вас нет в списке быстрого прохода! Попробуйте отсканировать лицо еще раз или подойдите к проводнику для входа в поезд.';
                            const utterance = new SpeechSynthesisUtterance(message);
                            utterance.lang = 'ru-RU';
                            window.speechSynthesis.speak(utterance);
                            return showSweetAlert('error', 'Вас нет в списке быстрого прохода!', message, 8000);
                        } else {
                            noFaceCounter++;
                            if (noFaceCounter >= 10) {
                                announceInvitation();
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка при распознавании лица:', error);
                        return showSweetAlert('error', 'Ошибка!', 'Произошла ошибка, попробуйте снова.', 5000);
                    })
                    .finally(() => {
                        // Задержка перед продолжением работы
                        setTimeout(() => {
                            recognitionInProgress = false;
                        }, 1000); // Задержка после показа алерта перед продолжением
                    });
            }

            function showSweetAlert(icon, title, text, time) {
                return Swal.fire({
                    icon: icon,
                    title: title,
                    text: text,
                    showConfirmButton: false,
                    timer: time // Продолжительность отображения алерта
                });
            }
        });
    </script>
    <script src="{% static 'assets/vendor/libs/sweetalert2/sweetalert2.js' %}"></script>
{% endblock %}
